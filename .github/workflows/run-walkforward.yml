name: Walk-forward 검증

# 시세를 학습기간(In-Sample)과 검증기간(Out-of-Sample)으로 나눠 롤링
# 방식으로 검증한다. 학습기간에서 찾은 조건을 검증기간에 그대로
# 적용해서 성과가 유지되는지 본다. 전체 기간에서 한 번에 1등을 뽑는
# find-best-strategy.yml과는 결과가 다르다(같은 조건으로 둘 다 계산해서
# 나란히 남긴다).

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "종목 하나 (예: SOXL)"
        required: true
      capital:
        description: "총자본(원)"
        required: true
      search:
        description: '전략 키 -> 변수별 후보값 목록 JSON(대시보드가 만들어 보낸다)'
        required: true
      start:
        description: "조회 시작일 YYYY-MM-DD. 비워 두면 받아 둔 시세 전체를 쓴다."
        required: false
      end:
        description: "조회 종료일 YYYY-MM-DD. 비워 두면 받아 둔 시세 전체를 쓴다."
        required: false
      in_sample_years:
        description: "학습기간(년)"
        required: true
        default: "3"
      out_sample_years:
        description: "검증기간(년)"
        required: true
        default: "1"
      step_years:
        description: "다음 폴드로 이동하는 간격(년)"
        required: true
        default: "1"
      upload:
        description: "결과를 02_백테스트결과에 올린다"
        type: boolean
        default: true

concurrency:
  group: run-walkforward
  cancel-in-progress: false

jobs:
  walk-forward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Walk-forward 검증
        env:
          SYMBOL: ${{ github.event.inputs.symbol }}
          CAPITAL: ${{ github.event.inputs.capital }}
          SEARCH: ${{ github.event.inputs.search }}
          START: ${{ github.event.inputs.start }}
          END: ${{ github.event.inputs.end }}
          IN_SAMPLE_YEARS: ${{ github.event.inputs.in_sample_years }}
          OUT_SAMPLE_YEARS: ${{ github.event.inputs.out_sample_years }}
          STEP_YEARS: ${{ github.event.inputs.step_years }}
          UPLOAD: ${{ github.event.inputs.upload }}
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_IMPERSONATE_EMAIL: master@sondullab.com
        run: |
          ARGS=(--symbol "$SYMBOL" --capital "$CAPITAL" --search "$SEARCH"
                --in-sample-years "$IN_SAMPLE_YEARS" --out-sample-years "$OUT_SAMPLE_YEARS"
                --step-years "$STEP_YEARS")
          if [ -n "$START" ]; then ARGS+=(--start "$START"); fi
          if [ -n "$END" ]; then ARGS+=(--end "$END"); fi
          if [ "$UPLOAD" = "true" ]; then ARGS+=(--upload); fi
          python scripts/run_walkforward.py "${ARGS[@]}"
