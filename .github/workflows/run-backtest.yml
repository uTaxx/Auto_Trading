name: 백테스트 비교

# 구글 드라이브에 쌓인 시세로 여러 매수 방식을 비교한다. 최대 5개
# 전략까지 한 번에 견줄 수 있다. 결과 표는 실행 로그에 찍히고,
# upload를 켜면 02_백테스트결과에 JSON으로도 남는다.

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "쉼표로 구분한 티커 (예: SPY,QQQ)"
        required: true
      strategies:
        description: '전략 설정 JSON 배열(최대 5개, 대시보드가 만들어 보낸다). 예: [{"key":"lump_sum"}]'
        required: true
      capital:
        description: "종목·전략마다 쓰는 총자본(원)"
        required: true
      start:
        description: "조회 시작일 YYYY-MM-DD"
        required: true
      end:
        description: "조회 종료일 YYYY-MM-DD"
        required: true
      upload:
        description: "결과를 02_백테스트결과에 올린다"
        type: boolean
        default: true

concurrency:
  group: run-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: 전략 비교 계산
        env:
          SYMBOLS: ${{ github.event.inputs.symbols }}
          STRATEGIES: ${{ github.event.inputs.strategies }}
          CAPITAL: ${{ github.event.inputs.capital }}
          START: ${{ github.event.inputs.start }}
          END: ${{ github.event.inputs.end }}
          UPLOAD: ${{ github.event.inputs.upload }}
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_IMPERSONATE_EMAIL: master@sondullab.com
        run: |
          ARGS=(--symbols "$SYMBOLS" --capital "$CAPITAL" --strategies "$STRATEGIES" --start "$START" --end "$END")
          if [ "$UPLOAD" = "true" ]; then ARGS+=(--upload); fi
          python scripts/run_backtest.py "${ARGS[@]}"
